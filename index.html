<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>私の選ぶイベスト9選</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #a3d8ff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px;
}

h1 {
  text-align: center;
  color: #fff;
  font-size: 1.8rem;
  margin-bottom: 24px;
}

.wrap {
  display: flex;
  gap: 24px;
  justify-content: center;
  max-width: 1100px;
  width: 100%;
}

.panel {
  width: 480px;
  background: #fff;
  border-radius: 16px;
  padding: 20px;
}

/* 右側のランキングパネルの高さを中身ピッタリにする */
#rankingPanel {
  height: fit-content;
}

h2 {
  font-size: 1.2rem;
  margin-bottom: 12px;
  color: #0077cc;
  text-align: center;
}

.searchContainer {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

#searchInput {
  flex: 1;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #cce7ff;
  font-size: 1rem;
}

#clearSearchBtn {
  border: none;
  border-radius: 8px;
  background: #ff6fa5;
  color: #fff;
  font-weight: 600;
  padding: 0 12px;
  cursor: pointer;
}

.list {
  padding: 6px;
}

#charList {
  max-height: 520px;
  overflow-y: auto;
}

/* 共通カード */
.item,
.selectedItem {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  margin-bottom: 8px;
  border: 1px solid #cce7ff;
}

.item {
  background: #fefefe;
}

.selectedItem {
  background: #f0f9ff;
}

/* 一覧：検索時のみ画像（小） */
.item img {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}

#selectedList{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
}
.selectedItem{position:relative;border:none;padding:0;margin:0;background:none;}
.selectedItem img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;}
.removeBtn{position:absolute;top:4px;right:4px;border-radius:50%;width:24px;height:24px;}
.item strong,
.selectedItem strong {
  word-break: break-word;
}

button.addBtn,
button.removeBtn {
  background: #0077cc;
  color: #fff;
  font-weight: 600;
  border-radius: 8px;
  padding: 6px 12px;
  border: none;
  cursor: pointer;
}

.rankLabel {
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 20px;
  background: #0077cc;
  color: #fff;
  min-width: 44px;
  text-align: center;
}

.controls {
  margin-top: 16px;
  text-align: center;
  display: flex;
  justify-content: center;
  gap: 10px;
}

#screenshotBtn {
  background: #ff6fa5;
  color: #fff;
  border-radius: 8px;
  padding: 6px 12px;
  font-weight: 600;
  border: none;
  cursor: pointer;
}

#shareXBtn {
  background: #000000;
  color: #fff;
  border-radius: 8px;
  padding: 6px 12px;
  font-weight: 600;
  border: none;
  cursor: pointer;
}

@media (max-width: 600px) {
  .wrap {
    flex-direction: column;
    align-items: center;
  }
  .panel {
    width: 90%;
  }
}
</style>
</head>

<body>
<div class="mainContainer">
  <h1>私の選ぶイベスト9選</h1>

  <div class="wrap">
    <div class="panel">
      <h2>イベスト一覧</h2>

      <div class="searchContainer">
        <input type="text" id="searchInput" placeholder="イベスト名で検索…">
        <button id="clearSearchBtn">×</button>
      </div>

      <div class="list" id="charList"></div>
    </div>

    <div class="panel" id="rankingPanel">
      <h2>私の選ぶイベスト9選</h2>
      <div class="list" id="selectedList"></div>
      <div class="controls">
        <button id="screenshotBtn">スクリーンショット</button>
        <button id="shareXBtn">Xでシェア</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

  {id: "char_38", name: "Code: BOX ミレニアムに迫る影～一つの問いと二つの答え～"},

  {id: "char_41", name: "ハイランダー鉄道爆走事件〜そして列車はなくなった〜"},

  {id: "char_45", name: "誰が為の芸術 〜偽飾の絵画と美学の行方〜"},
  {id: "char_46", name: "魔法少女ヘヴィキャリバー～エラの野望と正義の資格～"},
  {id: "char_47", name: "冬空の文芸復興 ～健全なる文化の交流について～"},
  {id: "char_48", name: "不忍ノ道 ～ファッションショー警護任務！の巻～"},
  {id: "char_49", name: "キヴォトス・未確認ミステリー～邪を払うツチノコ大調査～"},
  {id: "char_50", name: "嵐過天晴"},
  {id: "char_51", name: "出航！万魔船 マコト議長の華麗なる避暑"},
  {id: "char_52", name: "DIVE into OCEAN！"},
  {id: "char_53", name: "It’s our Engine! ～183号を脱出せよ！～"}
];

const MAX_SELECT = 9;
let selected = [];

/* ===== DOM ===== */
const charListEl = document.getElementById("charList");
const selectedListEl = document.getElementById("selectedList");
const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearSearchBtn");
const screenshotBtn = document.getElementById("screenshotBtn");
const shareXBtn = document.getElementById("shareXBtn");
const rankingPanel = document.getElementById("rankingPanel");

/* ===== 画像パス ===== */
function getImagePath(char) {
  const index = characterList.findIndex(c => c.id === char.id);
  return `image/${index + 1}.png`;
}

/* ===== 一覧描画 ===== */
function renderAll(list = characterList) {
  const showImage = searchInput.value.trim() !== "";
  charListEl.innerHTML = "";

  list.forEach(char => {
    const el = document.createElement("div");
    el.className = "item";

    el.innerHTML = `
      ${showImage ? `<img src="${getImagePath(char)}" alt="">` : ""}
      <div style="flex:1"><strong>${escapeHtml(char.name)}</strong></div>
      <button class="addBtn">追加</button>
    `;

    el.querySelector(".addBtn").onclick = () => addChar(char);
    charListEl.appendChild(el);
  });
}

/* ===== ランキング描画 ===== */
function renderSelected() {
  selectedListEl.innerHTML = "";

  selected.forEach((char, idx) => {
    const item = document.createElement("div");
    item.className = "selectedItem";
    item.draggable = true;
    item.dataset.id = char.id;

    item.innerHTML = `
<img src="${getImagePath(char)}" alt="">
<button class="removeBtn">×</button>
`;

    item.querySelector(".removeBtn").onclick = () => removeChar(char.id);
    item.addEventListener("dragstart", onDragStart);
    item.addEventListener("dragover", e => e.preventDefault());
    item.addEventListener("drop", onDrop);
    item.addEventListener("dragend", onDragEnd);

    selectedListEl.appendChild(item);
  });
}

/* ===== 操作 ===== */
function addChar(char) {
  if (selected.find(c => c.id === char.id)) {
    alert("すでに選択されています");
    return;
  }
  if (selected.length >= MAX_SELECT) {
    alert("選択できるのは9個までです");
    return;
  }
  selected.push(char);
  renderSelected();
}

function removeChar(id) {
  selected = selected.filter(c => c.id !== id);
  renderSelected();
}

/* ===== 並び替え ===== */
let dragSrcId = null;

function onDragStart() {
  dragSrcId = this.dataset.id;
  this.style.opacity = "0.4";
}

function onDrop() {
  const targetId = this.dataset.id;
  if (dragSrcId === targetId) return;

  const from = selected.findIndex(c => c.id === dragSrcId);
  const to = selected.findIndex(c => c.id === targetId);
  const [moved] = selected.splice(from, 1);
  selected.splice(to, 0, moved);
  renderSelected();
}

function onDragEnd() {
  this.style.opacity = "";
  dragSrcId = null;
}

/* ===== 検索 ===== */
searchInput.addEventListener("input", () => {
  const key = searchInput.value.toLowerCase();
  const filtered = characterList.filter(c =>
    c.name.toLowerCase().includes(key)
  );
  renderAll(filtered);
});

clearBtn.onclick = () => {
  searchInput.value = "";
  renderAll();
};

/* ===== スクショ ===== */
screenshotBtn.onclick = async () => {
  if (selected.length === 0) {
    alert("イベストを選択してください");
    return;
  }

  document.querySelectorAll(".removeBtn").forEach(b => b.style.display = "none");
  screenshotBtn.style.display = "none";
  shareXBtn.style.display = "none";

  try {
    const rect = rankingPanel.getBoundingClientRect();

    const canvas = await html2canvas(rankingPanel, {
      backgroundColor: "#fff",
      height: rect.height,
      windowHeight: rect.height
    });
    const a = document.createElement("a");
    a.download = "9evest.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  } catch (e) {
    alert("スクリーンショットの生成に失敗しました");
    console.error(e);
  } finally {
    document.querySelectorAll(".removeBtn").forEach(b => b.style.display = "");
    screenshotBtn.style.display = "";
    shareXBtn.style.display = "";
  }
};

/* ===== Xでシェア ===== */
shareXBtn.onclick = () => {
  const shareText = 
`私の選ぶイベスト9選

https://lia-2025.github.io/my-ba-9evest/

#ブルアカ
#私の選ぶイベスト9選`;

  const shareUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
  
  window.open(shareUrl, "_blank");
};

/* ===== HTMLエスケープ ===== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])
  );
}

renderAll();
</script>
</body>
</html>
